apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment-canary
  namespace: unibooker
spec:
  selector:
    matchLabels:
      app: frontend
      ver: canary
  replicas: 1
  template:
    metadata:
      labels:
        app: frontend
        ver: canary
    spec:
      containers:
      - name: frontend
        image: inkverseunibooker/frontend:IMAGE_TAG_PLACEHOLDER
        ports:
          - containerPort: 80
